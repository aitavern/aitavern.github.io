name: Application
description: Apply to join AI Tavern
title: "Application: "
labels: ["application"]
body:
  - type: markdown
    attributes:
      value: |
        Submit a GitHub repo with a near production-grade system — something you use daily, something your business cannot operate without. A tool, framework, pipeline, or system that other members can adopt and 10x their own startup, business, productivity, or processes.

        Not a demo. Not a tutorial. Not a proof of concept. The bar is high on purpose. Every member got in by clearing it. Your repo is your proof of work.

        ---

        **Need help articulating your system?** Copy this prompt into Claude, ChatGPT, or any LLM:

        > I'm applying to AI Tavern. Help me fill two textareas — concrete, no marketing.
        >
        > Repo: `<URL or local path>`
        >
        > **Step 1 — screen the code, not the README.** Open the repo and read the actual source for the main pipeline modules and agent prompts. Pull real file paths, function names, and constants. If you can't read files (plain chat LLM), tell me — I'll paste the relevant files instead of you guessing from the README.
        >
        > **Field 1 — System Description** (~60 words, 3 sentences). Order: input→output, then stack, then daily use. No file paths here. Output inside a code block so I can copy it cleanly. Match this style:
        >
        > ```
        > A TypeScript pipeline that monitors GitHub issues labeled 'auto', decomposes tasks, generates code via Claude API, opens PRs with tests, self-merges on QA pass. Used daily for production.
        > ```
        >
        > **Field 2 — 10x Justification** (~3 bullets, ~35 words each). Each bullet: builder persona → specific file/function they'd lift → one condition if relevant. File paths required, pulled from Step 1. Output inside a code block. Match this style:
        >
        > ```
        > - Agent builders lift `decomposer.md` — splits specs over 12 files into child sub-issues.
        > - Code-gen builders lift `buildGate.ts` — baseline-aware verification.
        > - Ops builders lift `recovery.ts` — crash-recovery sweep on startup.
        > ```
        >
        > Rules: name real tech and real files. State what only works under certain conditions. No "seamless," "revolutionary," "self-healing." If you can't back a claim with a file you actually opened, cut it.

  - type: input
    id: display-name
    attributes:
      label: Display Name
      description: "How you want to appear on the tavern roster (e.g., 'Jane Doe' or 'Jane D.')."
      placeholder: Jane Doe
    validations:
      required: true

  - type: input
    id: repo-url
    attributes:
      label: GitHub Repo URL
      description: "Link to the repo you're submitting."
      placeholder: https://github.com/your-username/your-repo
    validations:
      required: true

  - type: textarea
    id: system-description
    attributes:
      label: System Description
      description: "What does your system do? What problem does it solve? Be concrete — name specific tools, frameworks, and workflows. Not 'an AI tool' but 'a pipeline that takes GitHub issues, decomposes them into tasks, generates PRs with tests, and self-merges after QA passes.'"
      placeholder: |
        e.g., A TypeScript pipeline that monitors GitHub issues labeled "auto", decomposes them into implementation tasks, generates code using Claude API with repo context, creates PRs with automated tests, runs QA review, and self-merges on approval. Handles worktree isolation for parallel work. Used daily for production feature development.
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: 10x-Everyone Justification
      description: "How will your contribution make every other member at least 10x better? Be specific about what workflows you enable, what problems you eliminate, what capabilities you add. 'Could be useful' is not enough — describe the concrete multiplier."
      placeholder: |
        e.g., Members building AI agents can plug into my task decomposition pipeline instead of building their own. Members doing code generation get my QA review patterns. Members shipping products get autonomous PR creation — their issues become merged code without manual intervention.
    validations:
      required: true

  - type: dropdown
    id: review-mode
    attributes:
      label: Code Review Preference
      description: |
        Choose how you'd like your submission assessed during the initial screening. All paths lead to the same demo stage. If your repo is public, opting into code screening helps us understand your system better. If it's private, you can invite our review bot for the same benefit.
      options:
        - "Text only — assess based on my description"
        - "Screen my repo — it's public, the agent can read it"
        - "Screen my repo — it's private, I'll invite @jinglescore as read-only collaborator"
    validations:
      required: true
